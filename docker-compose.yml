services:
  farmflow-sensors:
    container_name: farmflow-sensors
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Nothing here needs a Linux capability: each process runs as a non-root
    # user and binds a port above 1024. Dropping them all shrinks what a code
    # execution bug could reach for next, and no-new-privileges stops a setuid
    # binary inside the image from being used to climb back out.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - .env
    environment:
      # Must listen on every interface for the proxy to reach it.
      SENSORS_HOST: 0.0.0.0
    networks:
      - sajib-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5200/values/json')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  sajib-net:
    external: true
